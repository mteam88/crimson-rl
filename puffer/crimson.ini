[base]
env_name = crimson

[vec]
total_agents = 1024
num_buffers = 1
num_threads = 10

[env]
mode = 1
action_repeat = 2
max_ticks = 0
xp_scale_milli = 10
death_penalty_milli = 1000
alive_reward_milli = 0
seed = 73

[policy]
hidden_size = 256
num_layers = 1

[torch]
network = MinGRU
encoder = CrimsonEncoder
decoder = DefaultDecoder

[train]
total_timesteps = 2_000_000_000
horizon = 64
minibatch_size = 16384
learning_rate = 0.003
gamma = 0.995
gae_lambda = 0.95
ent_coef = 0.005
